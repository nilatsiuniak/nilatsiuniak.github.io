<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>ToDo List</h1>
    <input id="taskInput" class="task-input" type="text" placeholder="Нове завдання… (Enter)" autocomplete="off">
    <ul id="taskList" class="task-list"></ul>
    <p id="emptyMsg" class="empty" hidden>Завдань поки немає</p>
  </main>
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Лабораторна робота №2 — Рівні 4-6 та 7-9 балів</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Лабораторна робота №2 — Змінні та оператори в JavaScript</h1>

  <h2>Рівень 4-6 балів</h2>

  <div class="task">
    <button id="btn-1-1">Завдання 1: Привітання через prompt</button>
    <p id="output-1-1" class="output"></p>
  </div>

  <div class="task">
    <button id="btn-1-2">Завдання 2: Рік народження</button>
    <p id="output-1-2" class="output"></p>
  </div>

  <div class="task">
    <button id="btn-1-3">Завдання 3: Повне ім'я (консоль)</button>
    <p id="output-1-3" class="output"></p>
  </div>

  <h2>Рівень 7-9 балів</h2>

  <div class="task">
    <button id="btn-2-1">Завдання 1: Область видимості userName</button>
    <p id="output-2-1" class="output"></p>
  </div>

  <div class="task">
    <button id="btn-2-2">Завдання 2: Підтвердження через confirm</button>
    <p id="output-2-2" class="output"></p>
  </div>

  <div class="task">
    <button id="btn-2-3">Завдання 3: Парне чи непарне число</button>
    <p id="output-2-3" class="output"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
